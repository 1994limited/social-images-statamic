title: 'Social image'
fields:
  -
    handle: social_image_preview
    field:
      type: social_image_preview
      display: 'Social image'
      listable: false
  -
    handle: social_image_template
    field:
      type: social_image_template
      display: 'Template'
      instructions: 'Leave as is to use the template set for this collection.'
      listable: false
  -
    handle: social_image_override
    field:
      type: assets
      display: 'Use this image instead'
      instructions: 'Upload an image to share instead of the generated one. 1200 × 630 pixels is best.'
      max_files: 1
      mode: list
      listable: false
